name: One-time GCP secret migration

on: workflow_dispatch

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_MIGRATION_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Add email secret versions
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        shell: bash
        run: |
          printf '%s' "$EMAIL_TO" | gcloud secrets versions add email-to --data-file=- --project=avshabunevich-automations
          printf '%s' "$SMTP_USERNAME" | gcloud secrets versions add smtp-username --data-file=- --project=avshabunevich-automations
          printf '%s' "$SMTP_PASSWORD" | gcloud secrets versions add smtp-password --data-file=- --project=avshabunevich-automations
